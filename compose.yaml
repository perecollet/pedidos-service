services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pedidos
      SPRING_DATASOURCE_USERNAME: pedidos
      SPRING_DATASOURCE_PASSWORD: pedidos
      PROVEEDOR_LOGISTICO_URL: ${PROVEEDOR_LOGISTICO_URL:-http://wiremock:8080}
      PROVEEDOR_LOGISTICO_TOKEN: ${PROVEEDOR_LOGISTICO_TOKEN:?Define PROVEEDOR_LOGISTICO_TOKEN en .env (ver .env.example)}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
